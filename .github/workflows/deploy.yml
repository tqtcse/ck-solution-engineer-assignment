name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q -m "not aws"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381492018602:role/ck-agent-dev-gha
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push
        run: |
          TAG=${GITHUB_SHA::7}
          URI=${{ steps.ecr.outputs.registry }}/ck-agent-dev
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --output type=image,oci-mediatypes=false,push=true \
            -t "$URI:$TAG" .
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var="image_tag=$IMAGE_TAG"

      - name: Smoke test
        working-directory: infra
        run: |
          URL=$(terraform output -raw app_url)
          BODY='{"session_id":"ci-smoke","message":"hello"}'
          HASH=$(printf '%s' "$BODY" | sha256sum | cut -d' ' -f1)
          curl -sf -m 60 -X POST "${URL}chat/stream" \
            -H 'content-type: application/json' \
            -H "x-amz-content-sha256: $HASH" \
            -d "$BODY" | head -c 200
