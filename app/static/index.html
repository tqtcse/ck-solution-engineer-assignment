<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>CK Agent</title>
    <style>
        body {
            font: 15px/1.6 system-ui;
            margin: 0;
            background: #f4f6f8;
            color: #1b2230;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #log {
            flex: 1;
            overflow: auto;
            padding: 12px 0;
        }

        .m {
            margin: 10px 0;
            padding: 11px 14px;
            border-radius: 12px;
            max-width: 82%;
            white-space: pre-wrap;
        }

        .u {
            background: #3a4e8c;
            color: #fff;
            margin-left: auto;
        }

        .b {
            background: #fff;
            border: 1px solid #d3dae4;
        }

        .t {
            font: 12px ui-monospace, monospace;
            color: #9a6410;
            background: #f8efdd;
            border-radius: 8px;
            padding: 5px 10px;
            margin: 6px 0;
            display: inline-block;
        }

        form {
            display: flex;
            gap: 8px;
            padding: 12px 0;
        }

        input {
            flex: 1;
            padding: 11px 14px;
            border: 1px solid #d3dae4;
            border-radius: 10px;
            font: inherit;
        }

        button {
            padding: 11px 20px;
            border: 0;
            border-radius: 10px;
            background: #3a4e8c;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div id="log"></div>
        <form id="f">
            <input id="q" placeholder="Ask about company policies, or check order status..." autofocus>
            <button>Send</button>
        </form>
    </div>
    <script>
        const log = document.getElementById('log');
        let sid = localStorage.getItem('sid');
        if (!sid) {
            sid = crypto.randomUUID();
            localStorage.setItem('sid', sid);
        }

        function add(cls, text) {
            const d = document.createElement('div');
            d.className = 'm ' + cls;
            d.textContent = text;
            log.appendChild(d);
            log.scrollTop = log.scrollHeight;
            return d;
        }

        document.getElementById('f').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('q');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            add('u', text);
            let bubble = null;

            const res = await fetch('/chat/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sid, message: text })
            });

            const reader = res.body.getReader(), dec = new TextDecoder();
            let buf = '';
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buf += dec.decode(value, { stream: true });
                const parts = buf.split('\n\n');
                buf = parts.pop();
                for (const p of parts) {
                    if (!p.startsWith('data: ')) continue;
                    const ev = JSON.parse(p.slice(6));
                    if (ev.type === 'token') {
                        if (!bubble) bubble = add('b', '');
                        bubble.textContent += ev.data;
                        log.scrollTop = log.scrollHeight;
                    } else if (ev.type === 'tool_start') {
                        const t = document.createElement('div');
                        t.className = 't';
                        t.textContent = '⚙ calling ' + ev.data + '...';
                        log.appendChild(t);
                        bubble = null;
                    } else if (ev.type === 'error') {
                        add('b', '⚠ ' + ev.data);
                    }
                }
            }
        };
    </script>
</body>

</html>
